{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="container" style="max-width:500px;margin:60px auto;">

    <h2>Forgot your password?</h2>

    <p>
        Enter your email address and we'll send you a password reset link.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</div>

{% endblock %}
