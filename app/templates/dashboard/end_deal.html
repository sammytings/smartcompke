{% extends "dashboard/base.html" %}

{% block content %}

<style>
    :root {
        --sc-blue: #1a56db;
        --sc-blue-dark: #123f9e;
        --sc-blue-light: #eaf1fd;
        --sc-red: #dc2626;
        --sc-red-dark: #b91c1c;
        --sc-red-light: #fdecec;
        --sc-text: #1f2937;
        --sc-muted: #6b7280;
        --sc-border: #e5e7eb;
    }

    .sc-enddeal-wrap {
        max-width: 560px;
        margin: 2.5rem auto;
    }

    .sc-enddeal-card {
        border: 1px solid var(--sc-border);
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(17, 24, 39, 0.06);
        padding: 2rem 2.25rem;
        background: #fff;
    }

    .sc-enddeal-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--sc-red-light);
        color: var(--sc-red);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .sc-enddeal-card h2 {
        font-weight: 700;
        color: var(--sc-text);
        margin-bottom: 0.4rem;
    }

    .sc-enddeal-card > p {
        color: var(--sc-muted);
        font-size: 0.94rem;
        margin-bottom: 0;
    }

    .sc-enddeal-card hr {
        border-top: 1px solid var(--sc-border);
        margin: 1.5rem 0;
    }

    .sc-deal-summary {
        background: var(--sc-blue-light);
        border-radius: 10px;
        padding: 1.1rem 1.25rem;
        margin-bottom: 0.5rem;
    }

    .sc-deal-summary h3 {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--sc-blue-dark);
        margin-bottom: 0.75rem;
    }

    .sc-deal-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
        padding: 0.3rem 0;
        color: var(--sc-text);
    }

    .sc-deal-row .sc-label {
        color: var(--sc-muted);
    }

    .sc-deal-row .sc-price {
        font-weight: 700;
        color: var(--sc-blue-dark);
        font-size: 1rem;
    }

    .sc-enddeal-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.75rem;
    }

    .btn-sc-danger {
        background: linear-gradient(135deg, var(--sc-red) 0%, var(--sc-red-dark) 100%);
        border: none;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.55rem 1.2rem;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(220, 38, 38, 0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-sc-danger:hover {
        background: linear-gradient(135deg, var(--sc-red-dark) 0%, #991b1b 100%);
        box-shadow: 0 4px 10px rgba(220, 38, 38, 0.35);
        transform: translateY(-1px);
        color: #fff;
    }

    .btn-sc-cancel {
        background: #fff;
        border: 1px solid var(--sc-border);
        color: var(--sc-text);
        font-weight: 600;
        font-size: 0.9rem;
        padding: 0.55rem 1.2rem;
        border-radius: 8px;
        transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-sc-cancel:hover {
        background: #f9fafb;
        border-color: #d1d5db;
        color: var(--sc-text);
    }
</style>

<div class="sc-enddeal-wrap">
    <div class="sc-enddeal-card">

        <div class="sc-enddeal-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <h2>End Deal</h2>
        <p>Are you sure you want to end this deal? This action cannot be undone.</p>

        <hr>

        <div class="sc-deal-summary">
            <h3>{{ variant.product.name }}</h3>
            <div class="sc-deal-row">
                <span class="sc-label">Current Deal Price</span>
                <span class="sc-price">KSh {{ variant.discount_price }}</span>
            </div>
            <div class="sc-deal-row">
                <span class="sc-label">Ends</span>
                <span>{{ variant.discount_end }}</span>
            </div>
        </div>

        <form method="post" class="sc-enddeal-actions">
            {% csrf_token %}
            <button type="submit" class="btn-sc-danger">
                <i class="fas fa-ban" style="margin-right:6px;"></i>End Deal
            </button>
            <a href="{% url 'dashboard_deals' %}" class="btn-sc-cancel">Cancel</a>
        </form>

    </div>
</div>

{% endblock %}
