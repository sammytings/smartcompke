{% extends "dashboard/base.html" %}

{% block title %}Add Category{% endblock %}

{% block content %}

<style>
/*==================================================
        ADD CATEGORY PAGE
        SmartComputersKE Admin Dashboard
==================================================*/

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
}

.page-header h2{
    font-size:2rem;
    font-weight:700;
    color:#0f172a;
    margin-bottom:6px;
}

.page-header p{
    color:#64748b;
    margin:0;
    font-size:.95rem;
}

/*=====================================
BUTTONS
=====================================*/

.btn-secondary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    background:#fff;
    border:2px solid #dbe4f0;
    color:#2563eb;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    transition:.3s;
}

.btn-secondary:hover{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
}

.btn-primary{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px 34px;
    font-size:.95rem;
    font-weight:700;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 14px 35px rgba(37,99,235,.22);
}

.btn-primary:hover{
    transform:translateY(-3px);
    box-shadow:0 20px 40px rgba(37,99,235,.30);
}

/*=====================================
CARD
=====================================*/

.card{
    background:#fff;
    border:none;
    border-radius:18px;
    padding:30px;
    box-shadow:0 12px 40px rgba(15,23,42,.07);
    transition:.25s;
    max-width:640px;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 45px rgba(15,23,42,.09);
}

.card h3{
    font-size:1.2rem;
    font-weight:700;
    color:#0f172a;
    margin-bottom:25px;
    padding-bottom:15px;
    border-bottom:1px solid #edf2f7;
}

/*=====================================
FORM (form.as_p output)
Django renders each field as its own <p> containing a
<label> then the widget, so we style those directly.
=====================================*/

.card form p{
    margin:0 0 22px;
}

.card form p:last-of-type{
    margin-bottom:0;
}

.card form label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
    font-size:.92rem;
}

.card form input,
.card form select,
.card form textarea{
    width:100%;
    border:1px solid #dbe4f0;
    border-radius:12px;
    background:#fff;
    padding:13px 15px;
    transition:.25s;
    font-size:.95rem;
    box-shadow:none;
    box-sizing:border-box;
    font-family:inherit;
}

.card form input:focus,
.card form select:focus,
.card form textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.card form textarea{
    resize:vertical;
    min-height:110px;
}

/*=====================================
FILE INPUT
=====================================*/

.card form input[type=file]{
    padding:12px;
    border:2px dashed #cbd5e1;
    background:#f8fbff;
    cursor:pointer;
}

.card form input[type=file]:hover{
    border-color:#2563eb;
}

/*=====================================
CHECKBOX FIELDS (e.g. "Active")
Django wraps these in <p> too, but a checkbox shouldn't
stretch full width or get the block-label treatment.
=====================================*/

.card form p:has(input[type=checkbox]){
    display:flex;
    align-items:center;
    gap:12px;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:14px 18px;
}

.card form p:has(input[type=checkbox]) label{
    margin:0;
    order:2;
    cursor:pointer;
}

.card form input[type=checkbox]{
    width:20px;
    height:20px;
    cursor:pointer;
    order:1;
}

/*=====================================
HELP TEXT / ERRORS
=====================================*/

.card form .helptext{
    display:block;
    margin-top:6px;
    font-size:.82rem;
    color:#94a3b8;
}

.card form ul.errorlist{
    list-style:none;
    margin:6px 0 0;
    padding:0;
    color:#dc2626;
    font-size:.85rem;
    font-weight:600;
}

/*=====================================
SAVE AREA
=====================================*/

.save-area{
    display:flex;
    justify-content:flex-end;
    margin-top:30px;
}

/*=====================================
RESPONSIVE
=====================================*/

@media(max-width:768px){

.page-header h2{
    font-size:1.6rem;
}

.card{
    padding:22px;
    border-radius:16px;
    max-width:100%;
}

.card h3{
    font-size:1.05rem;
}

}

@media(max-width:480px){

.page-header h2{
    font-size:1.4rem;
}

.card{
    padding:18px;
}

.btn-primary{
    width:100%;
    justify-content:center;
}

.card form input,
.card form select,
.card form textarea{
    font-size:.9rem;
}

}
</style>

<div class="page-header">

    <div>

        <h2>Add Category</h2>

        <p>Create a new product category for the storefront.</p>

    </div>

    <a href="{% url 'dashboard_categories' %}" class="btn-secondary">

        <i class="fas fa-arrow-left"></i>

        Back

    </a>

</div>

<div class="card">

    <h3>Category Details</h3>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="save-area">

            <button class="btn-primary">

                <i class="fas fa-save"></i>

                Save Category

            </button>

        </div>

    </form>

</div>

{% endblock %}
