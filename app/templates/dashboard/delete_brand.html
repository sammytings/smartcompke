{% extends "dashboard/base.html" %}



{% block content %}



<div class="delete-card">


<h2>
Delete Brand
</h2>


<p>

Are you sure you want to delete:

<strong>
{{brand.name}}
</strong>

?

</p>



<form method="POST">

{% csrf_token %}


<button class="btn-danger">

Yes, Delete

</button>



<a href="{% url 'dashboard_brands' %}" class="btn-secondary">

Cancel

</a>


</form>



</div>



{% endblock %}
