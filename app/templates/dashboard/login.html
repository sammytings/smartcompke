{% extends "base.html" %}

{% block content %}
<style>
  :root {
    --navy-deep: #0b1f3a;
    --navy-mid: #16305a;
    --crimson: #c41e3a;
    --crimson-dark: #9c1730;
    --ink: #1a1a1a;
    --paper: #fbfaf8;
    --muted: #6b7280;
  }

  .login-container {
    max-width: 380px;
    margin: 6rem auto;
    padding: 2.5rem 2.25rem 2rem;
    background: var(--paper);
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(11, 31, 58, 0.35);
    position: relative;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .login-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--crimson) 0%, var(--crimson) 50%, var(--navy-deep) 50%, var(--navy-deep) 100%);
  }

  .login-container h2 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--navy-deep);
    text-align: center;
    margin: 0 0 0.4rem;
    letter-spacing: 0.01em;
  }

  .login-container h2::after {
    content: "";
    display: block;
    width: 42px;
    height: 3px;
    margin: 0.65rem auto 1.75rem;
    background: var(--crimson);
    border-radius: 2px;
  }

  .login-container form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .login-container input[type="text"],
  .login-container input[type="password"] {
    padding: 0.75rem 0.9rem;
    border: 1.5px solid #d8dce3;
    border-radius: 6px;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .login-container input[type="text"]::placeholder,
  .login-container input[type="password"]::placeholder {
    color: var(--muted);
  }

  .login-container input[type="text"]:focus,
  .login-container input[type="password"]:focus {
    border-color: var(--navy-mid);
    box-shadow: 0 0 0 3px rgba(22, 48, 90, 0.15);
  }

  .login-container button[type="submit"] {
    margin-top: 0.5rem;
    padding: 0.8rem 1rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-dark) 100%);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }

  .login-container button[type="submit"]:hover {
    background: linear-gradient(135deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
    box-shadow: 0 6px 16px rgba(11, 31, 58, 0.3);
    transform: translateY(-1px);
  }

  .login-container button[type="submit"]:active {
    transform: translateY(0);
  }

  .login-container p {
    text-align: center;
    font-size: 0.85rem;
    color: var(--crimson-dark);
    background: rgba(196, 30, 58, 0.08);
    border: 1px solid rgba(196, 30, 58, 0.2);
    border-radius: 6px;
    padding: 0.55rem 0.75rem;
    margin: 1.25rem 0 0;
  }

  body {
    background: radial-gradient(circle at top, var(--navy-mid) 0%, var(--navy-deep) 65%);
    min-height: 100vh;
    margin: 0;
  }
</style>

<div class="login-container">

  <h2>
    Dashboard Login
  </h2>

  <form method="POST">

    {% csrf_token %}

    <input
      type="text"
      name="username"
      placeholder="Username"
      required>

    <input
      type="password"
      name="password"
      placeholder="Password"
      required>

    <button type="submit">
      Login
    </button>

  </form>

  {% if messages %}
    {% for message in messages %}
      <p>
        {{ message }}
      </p>
    {% endfor %}
  {% endif %}

</div>

{% endblock %}
