{% extends "dashboard/base.html" %}


{% block content %}


<div class="dashboard-header">

<h1>
Add Brand
</h1>


<a href="{% url 'dashboard_brands' %}" class="btn-secondary">
Back
</a>


</div>



<div class="form-card">


<form method="POST" enctype="multipart/form-data">


{% csrf_token %}



<div class="form-group">

<label>
Brand Name
</label>


{{form.name}}


{% if form.name.errors %}

<div class="error">

{{form.name.errors}}

</div>

{% endif %}


</div>




<div class="form-group">

<label>
Brand Logo
</label>


{{form.logo}}


</div>



<button class="btn-primary">

Save Brand

</button>



</form>


</div>



{% endblock %}
