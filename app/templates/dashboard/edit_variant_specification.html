{% extends "dashboard/base.html" %}

{% block title %}
Edit Specification
{% endblock %}

{% block content %}
<style>
  .spec-edit-wrap {
    max-width: 520px;
    margin: 40px auto;
    padding: 32px 36px;
    background: #ffffff;
    border: 1px solid #dbe4f3;
    border-top: 5px solid #1d4ed8;
    border-radius: 10px;
    box-shadow: 0 10px 24px -10px rgba(15, 23, 42, 0.18);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .spec-edit-wrap h2 {
    margin: 0 0 6px;
    color: #1d4ed8;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .spec-edit-wrap hr {
    border: none;
    border-top: 2px solid #dc2626;
    width: 48px;
    margin: 10px 0 26px;
  }

  .spec-edit-wrap form label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #1d4ed8;
    margin-bottom: 6px;
  }

  .spec-edit-wrap form input,
  .spec-edit-wrap form select,
  .spec-edit-wrap form textarea {
    width: 100%;
    padding: 11px 14px;
    font-size: 14.5px;
    color: #0f172a;
    background: #f8fafc;
    border: 1.5px solid #dbe4f3;
    border-radius: 8px;
    box-sizing: border-box;
    transition: border-color .15s, box-shadow .15s;
  }

  .spec-edit-wrap form input:focus,
  .spec-edit-wrap form select:focus,
  .spec-edit-wrap form textarea:focus {
    outline: none;
    border-color: #1d4ed8;
    box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
    background: #fff;
  }

  .spec-edit-wrap button {
    display: inline-block;
    margin-top: 10px;
    padding: 12px 28px;
    background: #dc2626;
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }

  .spec-edit-wrap button:hover {
    background: #b91c1c;
  }
</style>

<div class="spec-edit-wrap">
  <h2>Edit Specification</h2>
  <hr>

  <form method="POST">
    {% csrf_token %}

    <label>Specification</label>
    {{ form.specification }}
    <br><br>

    <label>Value</label>
    {{ form.value }}
    <br><br>

    <button>Save</button>
  </form>
</div>
{% endblock %}
